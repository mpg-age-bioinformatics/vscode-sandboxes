name: Security checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Go regressions and vet
        run: |
          go test ./... -timeout=240s
          go vet ./...
      - name: Known vulnerability gate
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...
      - name: Container security regressions
        run: |
          python3 scripts/test-remote-watchdog.py
          python3 scripts/test-remote-network.py
          python3 scripts/test-setup-directories.py
          python3 scripts/test-continue-distribution.py
          python3 scripts/test-remote-editor.py
          python3 scripts/test-agent-network.py
          node scripts/test-remote-ui.js
